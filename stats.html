<!DOCTYPE html>
<!-- 旧「コーパス統計」ページ。統計は search.html（コーパス検索・統計）の〈統計〉ビューに統合しました。
     このファイルは古いリンクやブックマークのための転送だけを行います（?doc=republic / ?doc=eugnostos は引き継ぎます）。
     統計の中身を直すときは search.html の SECTIONS / computeStats() を編集してください。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>コーパス統計 — Sheneset</title>
<link rel="canonical" href="search.html?view=stats">
<script>
(function () {
  var from = new URLSearchParams(location.search), to = new URLSearchParams();
  if (from.get("doc")) to.set("doc", from.get("doc"));
  to.set("view", "stats");
  location.replace("search.html?" + to.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=search.html?view=stats"></noscript>
<style>
html{background:#0a0918}
body{margin:0; padding:40px 20px; color:#ede8dc; font-family:'Inter','Noto Sans JP',system-ui,sans-serif; font-size:.95rem; line-height:1.8; text-align:center}
a{color:#e7c885; text-underline-offset:5px}
</style>
</head>
<body>
<p>コーパス統計は「コーパス検索・統計」のページに統合しました。<br>
Corpus statistics are now part of the corpus search page.</p>
<p><a href="search.html?view=stats">統計を開く / Open the statistics →</a></p>
</body>
</html>
