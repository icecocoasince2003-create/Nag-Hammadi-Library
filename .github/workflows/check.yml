# Sheneset の自動チェック。Pull Request と、main への push のたびに走ります。
# 手元で同じことを確かめるには、リポジトリのルートで各ステップの run を実行します（CONTRIBUTING.md の「6. 確かめ方」）。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: TEI の点検（scripts/check_tei.py）
        run: python3 scripts/check_tei.py

      - name: コーパス検索と確認作業の画面のテスト（tests/corpus-query.test.cjs・tests/review-core.test.cjs）
        run: node --test tests/corpus-query.test.cjs tests/review-core.test.cjs

      - name: 確認作業の画面で書き出したファイルを読むスクリプトのテスト（tests/test_*.py）
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: 確認作業の画面のテスト（tests/review.test.html を、ヘッドレスの Chrome で開く）
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/tests/review.test.html > /dev/null && break; sleep 0.5; done
          out=$(google-chrome --headless=new --disable-gpu --no-sandbox --no-first-run --virtual-time-budget=60000 --dump-dom "http://127.0.0.1:8765/tests/review.test.html")
          echo "$out" | grep -o '<span class="[pf]">[^<]*' | sed 's/<span class="[pf]">//'
          echo "$out" | grep -q 'id="result" data-status="pass"' || { echo "::error file=tests/review.test.html::確認作業の画面のテストが通りません"; exit 1; }

      - name: JSON の構文（data/*.json・iiif/*.json）
        run: |
          bad=0
          for f in data/*.json iiif/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::JSON として読めません"; bad=1; }
          done
          exit $bad

      - name: 表記ゆれ（scripts/check_style.py、規則は scripts/style_rules.json）
        run: python3 scripts/check_style.py

      - name: 生成ファイルが最新か（scripts/build_site.py --check）
        run: python3 scripts/build_site.py --check

      - name: 版の情報がそろっているか（data/release.json・CITATION.cff・.zenodo.json。scripts/check_release.py）
        run: python3 scripts/check_release.py

      - name: CITATION.cff の検証（cffconvert）
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
